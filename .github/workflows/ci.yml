name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  # Dummy, non-secret values — sufficient for DEBUG-mode settings.py to boot
  # without touching real secrets. Never use these outside CI.
  SECRET_KEY: ci-dummy-secret-key-not-for-production-use
  BACKEND_PASSWORD_SALT: ci-dummy-salt-not-for-production-use
  DJANGO_DEBUG: "True"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing

  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Regenerate schema to a temp file
        run: python manage.py spectacular --file /tmp/schema.generated.yaml

      - name: Diff generated schema against committed api/schema.yaml
        run: |
          if ! diff -u api/schema.yaml /tmp/schema.generated.yaml; then
            echo "::error::api/schema.yaml is out of date. Run 'make schema' (or"\
                 "'python manage.py spectacular --file api/schema.yaml') and commit the result."
            exit 1
          fi

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
