name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_FILE: .python-version

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Ruff (F821 undefined-name / E9 syntax-error ratchet)
        run: ruff check .

      - name: Django system check
        env:
          SECRET_KEY: ci-lint-only-not-a-real-secret
          DJANGO_DEBUG: "1"
        run: python manage.py check

      - name: Dependency vulnerability audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements/base.txt -r requirements/dev.txt || true

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prompeteer_test
          POSTGRES_USER: prompeteer
          POSTGRES_PASSWORD: prompeteer_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prompeteer -d prompeteer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-not-a-real-secret
      DJANGO_DEBUG: "1"
      POSTGRES_DB: prompeteer_test
      POSTGRES_USER: prompeteer
      POSTGRES_PASSWORD: prompeteer_test_pw
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      BACKEND_PASSWORD_SALT: ci-test-salt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Wait for Postgres
        env:
          PGPASSWORD: prompeteer_test_pw
        run: |
          until pg_isready -h localhost -p 5432 -U prompeteer; do sleep 1; done

      - name: Run migrations (exercises the Postgres DATABASES branch)
        run: python manage.py migrate --noinput

      - name: Run test suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov -v

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prompeteer-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python (for manage.py check --deploy)
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Deployment readiness check
        env:
          SECRET_KEY: ci-build-check-not-a-real-secret
        run: python manage.py check --deploy

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Regenerate OpenAPI schema
        env:
          SECRET_KEY: ci-contract-not-a-real-secret
          DJANGO_DEBUG: "1"
        run: python manage.py spectacular --file contract/openapi.yaml --validate

      - name: Fail if contract/openapi.yaml drifted from the committed schema
        run: git diff --exit-code contract/openapi.yaml

      - name: Upload schema artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: contract/openapi.yaml
