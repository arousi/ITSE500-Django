name: deploy

# Build the app image, push it to GHCR, and poke the VPS redeploy receiver so the box
# pulls the new image and recreates the container. The box side (compose + per-app token)
# is already wired: app "itse500-django" -> image ghcr.io/arousi/itse500-django. See the
# vps-infra repo's deploy/README.md for the receiver contract.
#
# runs-on: ubuntu-latest — this repo lives under the personal `arousi` account, which the
# SWE-Pioneers self-hosted `vps-builder` runner is NOT attached to, so it uses arousi's own
# GitHub-hosted minutes (the org has none). CI (lint/test) stays in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # Fire-and-check the per-app redeploy hook (deploy.swe.com.ly). Guarded by a repo
      # variable so a fork / a repo without the box token doesn't fail CI on a 401.
      - name: Trigger VPS redeploy
        if: vars.DEPLOY_TRIGGER_ENABLED == 'true'
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # The image is PRIVATE. This job's GITHUB_TOKEN can read this repo's own GHCR package, so
          # hand it to the box as X-GHCR-Token: the receiver's `docker compose pull` authenticates
          # with it (no PAT stored on the box, no public package). Valid for this job's lifetime —
          # the receiver pulls immediately.
          GHCR_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GHCR-Token: ${GHCR_TOKEN}" "${URL}") || true
          echo "receiver -> ${code}"; cat /tmp/body || true
          [ "$code" = "200" ] || { echo "::error::redeploy failed (${code})"; exit 1; }
