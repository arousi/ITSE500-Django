  /api/v1/user_mang/me/:
    get:
      operationId: v1_user_mang_me_retrieve
      description: |-
        GET

        Returns a nested payload containing `profile` and/or `chat` depending on flags.

        Response shape (high level):
            {
                "user_id": <uuid>,
                "is_new": <bool>,
                "temp_id": <str|null>,
                "profile": { ... } ,          # present when profile=true or by default
                "chat": {                     # present when chat=true or by default
                    "conversations": [...],
                    "messages": [...],
                    "message_request": [...],
                    "message_response": [...],
                    "message_output": [...],
                    "attachments": [...]
                }
            }

        Notes / implementation details:
        - Serializers: when available the view uses `FullProfileSerializer` and `FullChatSerializer` to produce the
          canonical output. If serializers fail the view falls back to minimal manual assembly.
        - Attachments returned in `chat.attachments` always include a `user_id` field (derived from the related
          message) to make ownership explicit for clients.

        Example Request:
            GET /api/v1/unified-sync/?user_id=123e4567-e89b-12d3-a456-426614174000&profile=true&chat=true

        Example Response (simplified):
            {
                "user_id": "123e4567-e89b-12d3-a456-426614174000",
                "is_new": false,
                "temp_id": null,
                "profile": {
                    "user_id": "123e4567-e89b-12d3-a456-426614174000",
                    "username": "john_doe",
                    "email": "john@example.com",
                    "is_visitor": false,
                    "is_active": true,
                    "is_archived": false
                },
                "chat": {
                    "conversations": [
                        {
                            "conversation_id": "c1",
                            "title": "My Conversation",
                            "messages": [ {"message_id": "m1", "content": "Hello!"} ]
                        }
                    ],
                    "messages": [ {"message_id": "m1", "content": "Hello!"} ],
                    "attachments": [
                        {
                            "id": 1,
                            "type": "image",
                            "file_path": "/media/attachments/1.png",
                            "user_id": "123e4567-e89b-12d3-a456-426614174000"
                        }
                    ]
                }
            }
      summary: Unified sync (fetch profile/chat)
      parameters:
      - in: query
        name: allow_public_uuid
        schema:
          type: boolean
        description: Allow unauthenticated read by UUID for GET
      - in: query
        name: chat
        schema:
          type: boolean
        description: Include chat section
      - in: query
        name: device_id
        schema:
          type: string
        description: Associate device with user/visitor
      - in: query
        name: profile
        schema:
          type: boolean
        description: Include profile section
      - in: query
        name: temp_id
        schema:
          type: string
        description: Visitor temp identifier (issues short-lived tokens)
      - in: query
        name: user_id
        schema:
          type: string
        description: User UUID (GET only, when allow_public_uuid=true)
      tags:
      - sync
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Nested profile/chat payload with optional visitor tokens
    post:
      operationId: v1_user_mang_me_create
      description: Upsert profile and chat model lists atomically; returns summary/errors
        and canonical payload.
      summary: Unified upsert (profile/chat)
      tags:
      - sync
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Upsert result with summary/errors and canonical payload
        '400':
          description: Validation error
        '500':
          description: Transaction failed
    patch:
      operationId: v1_user_mang_me_partial_update
      description: Authenticated partial update for profile fields (me endpoint style).
      summary: Partial profile update
      tags:
      - sync
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Updated profile
        '400':
          description: Validation error
        '401':
          description: Auth required
    delete:
      operationId: v1_user_mang_me_destroy
      description: |-
        DELETE

        Delete or archive a user's profile and/or chat data.

        Important behavior changes:
            - The ``action`` parameter is now restricted to "delete" or "archive". Other values are rejected.
            - On any successful delete or archive operation this endpoint will always generate BOTH a CSV and a
              PDF export of the user's data.
            - Exports are saved under MEDIA_ROOT/exports/<user_id> and emailed to the user's verified address when
              available.
            - If the caller provides ``download_now`` (truthy: 1/true/yes) the view will zip the CSV+PDF and
              immediately return the zip file as a FileResponse. If ``download_now`` is falsy the files are kept on
              disk and the response will include URLs the client can use to download them.

        Parameters (body or query):
            - action: "delete" | "archive"  (required)
            - profile: true/false
            - chat: true/false
            - download_now: true/false or 1/0 — when true return a zip (csv+pdf) immediately; when false save and
              return URLs instead
            - reason: optional string for audit logs

        Returns (examples):

        Example Request (delete + return URLs):
            DELETE /api/v1/unified-sync/
            {
                "user_id": "123e4567-e89b-12d3-a456-426614174000",
                "action": "delete",
                "profile": true,
                "chat": true,
                "download_now": false
            }

        Example Response (delete, saved exports):
            HTTP 200
            {
                "message": "User and all related data deleted successfully",
                "deleted": { "attachments": 2, "messages": 5, "conversations": 1, "tokens": 1, "user": 1 },
                "export_urls": {
                    "csv": "https://example.com/media/exports/<user_id>/user_export_20250829123000.csv",
                    "pdf": "https://example.com/media/exports/<user_id>/user_export_20250829123000.pdf"
                },
                "profile": { /* FullProfileSerializer output or minimal fallback */ },
                "chat": { /* FullChatSerializer output or minimal fallback */ }
            }

        Example Request (archive + immediate download):
            DELETE /api/v1/unified-sync/
            {
                "user_id": "123e4567-e89b-12d3-a456-426614174000",
                "action": "archive",
                "profile": true,
                "download_now": true
            }

        Example Response (archive, immediate zip):
            HTTP 200
            (A FileResponse serving an attachment named "user_export_<user_id>.zip" containing both CSV and PDF)

        Notes:
            - Exporting and emailing are best-effort. Failures while creating or sending exports are logged and do
              not prevent the delete/archive from completing.
            - The response will include ``export_urls`` when files are saved and not directly returned.
      summary: Delete or archive user data
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: '''delete'' or ''archive'''
      - in: query
        name: chat
        schema:
          type: boolean
      - in: query
        name: download_now
        schema:
          type: boolean
        description: If true, returns a zip of CSV+PDF
      - in: query
        name: profile
        schema:
          type: boolean
      tags:
      - sync
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Deletion/archive result with optional export URLs or zip
        '400':
          description: Invalid action or request
        '401':
          description: Auth required
components:
  schemas:
    AttachmentDoc:
      type: object
      properties:
        attachment_id:
          type: string
        message_id:
          type: string
        url:
          type: string
    AttachmentUpload:
      type: object
      description: |-
        Write-side Attachment serializer for the message-scoped upload/list endpoint.

        Dedicated to this endpoint only -- does NOT replace or alias
        `user_mang.serializers.AttachmentSerializer`, which the UnifiedSyncView still
        uses unchanged. The parent message is supplied by the view (from the URL),
        and `size_bytes`/`sha256` are computed server-side from the uploaded bytes.
      properties:
        attachment_id:
          type: string
          format: uuid
          readOnly: true
        message_id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          maxLength: 32
        mime_type:
          type: string
          nullable: true
          maxLength: 128
        encrypted_blob:
          type: string
          format: uri
          nullable: true
          description: Encrypted ciphertext blob uploaded by client
        size_bytes:
          type: integer
          readOnly: true
          nullable: true
        sha256:
          type: string
          readOnly: true
          nullable: true
        is_encrypted:
          type: boolean
        enc_algo:
          type: string
          nullable: true
          maxLength: 32
        iv_base64:
          type: string
          nullable: true
          maxLength: 64
        key_ref:
          type: string
          nullable: true
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_id
      - created_at
      - message_id
      - sha256
      - size_bytes
      - type
    AttachmentUploadRequest:
      type: object
      description: |-
        Write-side Attachment serializer for the message-scoped upload/list endpoint.

        Dedicated to this endpoint only -- does NOT replace or alias
        `user_mang.serializers.AttachmentSerializer`, which the UnifiedSyncView still
        uses unchanged. The parent message is supplied by the view (from the URL),
        and `size_bytes`/`sha256` are computed server-side from the uploaded bytes.
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 32
        mime_type:
          type: string
          nullable: true
          maxLength: 128
        encrypted_blob:
          type: string
          format: binary
          nullable: true
          description: Encrypted ciphertext blob uploaded by client
        is_encrypted:
          type: boolean
        enc_algo:
          type: string
          nullable: true
          maxLength: 32
        iv_base64:
          type: string
          nullable: true
          maxLength: 64
        key_ref:
          type: string
          nullable: true
          maxLength: 64
      required:
      - type
    Conversation:
      type: object
      description: |-
        Serialize a conversation with nested messages (read-only).
        For writes, clients send a flat conversation object; messages are synced separately.
      properties:
        conversation_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        local_only:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
      required:
      - conversation_id
      - created_at
      - messages
      - updated_at
      - user_id
    ConversationDoc:
      type: object
      properties:
        conversation_id:
          type: string
        title:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageDoc'
      required:
      - conversation_id
      - messages
    ConversationRequest:
      type: object
      description: |-
        Serialize a conversation with nested messages (read-only).
        For writes, clients send a flat conversation object; messages are synced separately.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
        local_only:
          type: boolean
    EmailPinVerifyRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        pin:
          type: string
          minLength: 1
          maxLength: 5
      required:
      - email
      - pin
    EmailPinVerifyResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        username:
          type: string
        user_password:
          type: string
    LoginResponse:
      type: object
      properties:
        message:
