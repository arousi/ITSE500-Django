    get:
      operationId: v1_auth_api_github_authorize_retrieve
      description: Construct and return (or redirect to) the GitHub authorization
        URL.
      tags:
      - v1
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
