  /api/v1/auth_api/google/callback:
    get:
      operationId: v1_auth_api_google_callback_retrieve
      description: |-
        Handle an OAuth2 callback from a provider and return a unified JSON payload.
        Validates state, exchanges code for tokens, creates/updates a user, persists
        provider tokens, and returns app JWTs. For mobile bridge flows, may redirect.
      summary: OAuth callback handler
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Authorization code
      - in: query
        name: error
        schema:
          type: string
        description: Error message from provider
      - in: query
        name: state
        schema:
          type: string
        description: Opaque state string
      tags:
      - oauth
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCallbackResponse'
          description: ''
        '400':
          description: Invalid state or token exchange failed
        '409':
          description: State already used
    post:
      operationId: v1_auth_api_google_callback_create
      description: Accept callback data via POST (bridge) and delegate to GET handler.
      summary: OAuth callback (POST bridge)
      tags:
      - oauth
      requestBody:
        content:
