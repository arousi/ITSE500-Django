# Local development stack: builds the same production Dockerfile but binds
# the source tree in for live-reload and uses SQLite (no POSTGRES_* env set).
# For the production stack (Traefik + Postgres, no bind-mount), see
# docker-compose.prod.yml.
services:
  web:
    build: .
    entrypoint: ["/server/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    volumes:
      - .:/server:cached
      - static_volume:/server/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=prompeteer_server.settings
      - DJANGO_DEBUG=1

volumes:
  static_volume: