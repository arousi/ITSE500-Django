# Public reverse proxy for the itse500 app. Traefik terminates TLS and forwards
# plain HTTP here; nginx forwards to gunicorn over the private itse500_internal
# network. nginx is the only container on the `proxy` network.

upstream itse500_app {
    server django-itse500-app:8000;
}

server {
    listen 80;
    server_name _;

    # Encrypted-blob uploads can be sizeable.
    client_max_body_size 25m;

    # nginx's own liveness (not proxied) — used by the container healthcheck.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://itse500_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Traefik already terminated TLS; tell Django the real scheme is HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
