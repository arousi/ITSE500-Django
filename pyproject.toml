[project]
name = "prompeteer-server"
version = "0.1.0"
description = "Prompeteer Server - Django/DRF backend"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "*/migrations/*",
    ".venv",
    "venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter, not worth failing lint over
    "B008",   # function calls in default args are common/required in DRF (e.g. Field(default=...))
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
