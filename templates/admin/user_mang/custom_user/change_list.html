{% extends "admin/change_list.html" %}

{% block content %}
{% if auth_health %}
<div class="module" style="margin-bottom: 16px;">
	<h2 style="margin: 0 0 12px 0;">Authentication Health</h2>
	<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
		{% for card in auth_health.cards %}
		<a href="{{ card.url }}" style="display:block; padding: 12px 14px; border: 1px solid var(--border-color, #dcdcdc); border-radius: 10px; text-decoration: none; background: var(--body-bg, #fff);">
			<div style="font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--body-quiet-color, #666);">{{ card.label }}</div>
			<div style="font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 6px;">{{ card.count }}</div>
		</a>
		{% endfor %}
	</div>
	<div style="margin-top: 12px; color: var(--body-quiet-color, #666);">
		Total users: {{ auth_health.stats.total_users }}
	</div>
</div>
{% endif %}
{{ block.super }}
{% endblock %}
